# ============================================
# OPEN5GS UE CONFIGURATION
# UERANSIM — aligned with config/open5gs-ue.yaml upstream
# ============================================

# --- UE Identity (must match Open5GS WebUI / MongoDB subscriber) ---
supi: 'imsi-999700000000001'

# --- PLMN ---
mcc: '999'
mnc: '70'

# --- SUCI (null scheme for lab) ---
protectionScheme: 0
homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
homeNetworkPublicKeyId: 1
routingIndicator: '0000'

# --- Authentication (must match WebUI subscriber exactly) ---
key: '465B5CE8B199B49FAA5F0A2EE238A6BC'
op: 'E8ED289DEBA952E4283B54E88E6183CA'
opType: 'OPC'
amf: '8000'

# --- Device identity ---
imei: '356938035643803'
imeiSv: '4370816125816151'

# --- TUN / namespace ---
tunNetmask: '255.255.255.0'
useNamespace: false
nsNamePrefix: 'ueransim'

# --- gNB to attach through ---
gnbSearchList:
  - 127.0.0.1

# --- UE access capabilities ---
uacAic:
  mps: false
  mcs: false
uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

# --- Auto-establish PDU session on registration ---
sessions:
  - type: 'IPv4'
    apn: 'internet'
    slice:
      sst: 1

# --- NSSAI ---
configured-nssai:
  - sst: 1

default-nssai:
  - sst: 1
    sd: 1

# --- Security algorithms ---
integrity:
  IA1: true
  IA2: true
  IA3: true
ciphering:
  EA1: true
  EA2: true
  EA3: true

integrityMaxRate:
  uplink: 'full'
  downlink: 'full'
