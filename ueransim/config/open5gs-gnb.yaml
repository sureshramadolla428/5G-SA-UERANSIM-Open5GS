# ============================================
# OPEN5GS gNB CONFIGURATION
# UERANSIM — aligned with config/open5gs-gnb.yaml upstream
# ============================================

# --- gNB Identity (must match Open5GS AMF PLMN/TAC) ---
mcc: '999'              # Open5GS default test PLMN
mnc: '70'
nci: '0x000000010'      # NR Cell Identity (36-bit hex)
idLength: 32            # gNB ID bit length (22–32 bits)
tac: 1                  # Tracking Area Code — must match AMF tai

# --- N2 / N3 Interface IPs ---
linkIp: 127.0.0.1       # Radio link simulation (match gnbSearchList in UE)
ngapIp: 127.0.0.1       # N2 NGAP bind/advertise IP
gtpIp: 127.0.0.1        # N3 GTP-U IP

# --- AMF Connection (Open5GS N2) ---
amfConfigs:
  - address: 127.0.0.5   # Open5GS default AMF bind (127.0.0.1 if Docker publishes :38412)
    port: 38412         # NGAP/SCTP — 3GPP standard

# --- Supported Network Slices (must match AMF plmn_support) ---
slices:
  - sst: 1

# --- SCTP compatibility ---
ignoreStreamIds: true

# --- NR Cell parameters ---
cells:
  - nrpci: 1
    sectorId: 0
    band: 78
    dlArfcn: 621000
    ssbArfcn: 620640
    scs: 30
    cpl: 2
    ssbPeriodicity: 20
    hncOffset: 0
    n2HoApiIp: 127.0.0.1
    n2HoApiPort: 9000

cellAccessType: nr
